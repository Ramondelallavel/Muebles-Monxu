[project]
name = "monxu"
version = "0.1.0"
description = "Plataforma de ingeniería y diseño paramétrico de mobiliario industrial"
requires-python = ">=3.11"
dependencies = [
  "cadquery>=2.8",
  "ezdxf>=1.4",
  "reportlab>=4.0",
  "openpyxl>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "numpy>=1.26",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pdfplumber>=0.11"]
ai = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["monxu*"]

[tool.setuptools.package-data]
"monxu.catalog" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: pruebas lentas (generación completa de expediente)"]
